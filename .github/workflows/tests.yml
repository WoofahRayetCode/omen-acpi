name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run synthetic regression tests
        run: ./tests/run.sh

      - name: Verify SHA256SUMS manifest
        run: sha256sum --check --strict SHA256SUMS

      - name: Shellcheck
        run: git ls-files -z '*.sh' omen-acpi | xargs -0 shellcheck --severity=error

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"
