name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run synthetic regression tests
        run: ./tests/run.sh

      - name: Verify SHA256SUMS manifest
        run: sha256sum --check --strict SHA256SUMS

      - name: Shellcheck
        run: |
          git ls-files -z '*.sh' omen-acpi packaging/85-omen-acpi-refresh | xargs -0 shellcheck --severity=error

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  portable-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check transformations and entry rules
        shell: pwsh
        run: |
          python -B tests/test_transform.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/test_kernel_entries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/test_maintenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
